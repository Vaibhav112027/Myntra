<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="x-icon" href="assest/images/urbanstyle-favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" type="text/css" href="assest/css/style.css">
    <title>Sign In - UrbanStyle</title>
    
</head>
<body>
    <div class="signup-section">
        <form>
            
        <h1 class="signup-title"><i class="fa-solid fa-user" ></i>    Sign Up Here</h1>
    
        <div class="form-control">
            <label>Username </label>
        <input type="text" name="" placeholder="Enter Your Name" required>
    </div>
    
    <div class="form-control">
        <label> Your City</label>
        <input type="text" name="" placeholder="Enter Your city" required>
    </div>
    <div class="form-control">
        <label>Dob</label>
        <input type="date" name="" required >
    </div>
    <div class="form-control">
        <label>Email</label>
        <input type="Email" name="" placeholder="Enter a valid email" required >
        </div>
        <div class="form-control">
            <label>Contact No.</label>
            <input type="text" placeholder="Your Contact number" required >
        </div>
        <div class="form-control">
            <button  class="submit-button">Submit</button>
        </div>
    </form>
    </div>
</body>
</html>
